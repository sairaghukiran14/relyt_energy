# One-command local run: `docker compose up --build`.
# The browser only ever talks to the frontend origin (localhost:5173); the Vite
# dev server proxies /api to the backend, mirroring the single-origin Vercel setup.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relyt
      POSTGRES_PASSWORD: relyt
      POSTGRES_DB: relyt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relyt"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://relyt:relyt@postgres:5432/relyt
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Apply migrations, then serve the API.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      target: build
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
